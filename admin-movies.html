    <h1 class="admin-title"> Quản lý phim </h1>
    <div class="admin-form">
        <form id="movieForm">
            <div id="form-alert" class="alert alert-warning form-alert d-none" role="alert"></div>
            <div class="form-group">
                <input type="text" id="name" placeholder="Tên phim" required>
                <small class="error-msg" id="error-name"></small>
            </div>
            <div class="form-group">
                <label class="form-label">Chọn poster phim</label>
                <input type="file" id="image-file" accept="image/*">
                <small class="error-msg" id="error-image"></small>
            </div>
            <div class="form-group">
                <input type="text" id="trailer" placeholder="Link phim" required>
                <small class="error-msg" id="error-trailer"></small>
            </div>
            <div class="form-group">
                <select id="category">
                    <option value="hoathinh">Hoạt hình</option>
                    <option value="anime">Anime</option>
                    <option value="haihuoc">Hài hước</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="duration" placeholder="Thời lượng (phút)" required>
                <small class="error-msg" id="error-duration"></small>
            </div>
            <div class="form-group">
                <input type="text" id="director" placeholder="Đạo diễn" required>
                <small class="error-msg" id="error-director"></small>
            </div>
            <div class="form-group">
                <input type="text" id="cast" placeholder="Diễn viên (ngăn cách bằng dấu phẩy)" required>
                <small class="error-msg" id="error-cast"></small>
            </div>
            <div class="form-group">
                <input type="text" id="language" placeholder="Ngôn ngữ" required>
                <small class="error-msg" id="error-language"></small>
            </div>
            <div class="form-group">
                <textarea id="description" placeholder="Mô tả phim" required></textarea>
                <small class="error-msg" id="error-description"></small>
            </div>
            <button type="submit" id="addMovie" class="admin-btn"> Thêm phim </button>
        </form>
    </div>

    <style>
        .form-group {
            margin-bottom: 15px;
        }
        .error-msg {
            display: block;
            color: red;
            font-size: 12px;
            margin-top: 5px;
            min-height: 14px;
        }
        input.is-invalid,
        textarea.is-invalid {
            border-color: red !important;
            background-color: #ffe6e6;
        }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
    </style>
