    <h1 class="admin-title"> Quản lý sản phẩm </h1>
    <div class="admin-form">
        <form id="productForm">
            <div id="form-alert" class="alert alert-warning form-alert d-none" role="alert"></div>
            <div class="form-group">
                <input type="text" id="name" placeholder="Tên sản phẩm" required>
                <small class="error-msg" id="error-name"></small>
            </div>
            <div class="form-group">
                <input type="text" id="price" placeholder="Giá sản phẩm (số)" required>
                <small class="error-msg" id="error-price"></small>
            </div>
            <div class="form-group">
                <label class="form-label">Chọn ảnh cho sản phẩm</label>
                <input type="file" id="image-file" accept="image/*">
                <small class="error-msg" id="error-image"></small>
            </div>
            <div class="form-group">
                <select id="category">
                    <option value="Góc ăn vặt">Góc ăn vặt</option>
                    <option value="Góc bắp rang">Góc bắp rang</option>
                    <option value="Góc giải khát">Góc giải khát</option>
                </select>
            </div>
            <div class="form-group">
                <textarea id="description" placeholder="Mô tả sản phẩm" required></textarea>
                <small class="error-msg" id="error-description"></small>
            </div>
            <button type="submit" class="admin-btn">Thêm sản phẩm</button>
        </form>
    </div>

    <style>
        .form-group {
            margin-bottom: 15px;
        }
        .error-msg {
            display: block;
            color: red;
            font-size: 12px;
            margin-top: 5px;
            min-height: 14px;
        }
        input.is-invalid,
        textarea.is-invalid {
            border-color: red !important;
            background-color: #ffe6e6;
        }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
    </style>

    <div class="admin-list">
        <h2>Sản phẩm đã thêm</h2>
        <div class="card-container" id="productList"> </div>
    </div>
