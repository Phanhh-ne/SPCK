<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Calistoga&family=Lalezar&family=Oswald:wght@200..700&family=Playwrite+CA:wght@100..400&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top ">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">PA Films</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="type.html">Thể loại</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="shopping.html">Mua sắm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin-movies.html">Quản lý phim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Quản lý mua sắm</a>
                    </li>
                </ul>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span id="nav-name">
                            <span id="nameuser"></span>
                        </span>
                    </li>
                    <li class="nav-item ms-3">
                        <button class="btn btn-outline-primary position-relative" type="button" data-bs-toggle="modal"
                            data-bs-target="#cartModal" aria-label="Giỏ hàng">
                            <ion-icon name="cart-outline"></ion-icon>
                            <span id="cartCount"
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                        </button>
                    </li>
                    <li class="nav-item ms-2" id="logoutNavItem" style="display: none;">
                        <button type="button" class="btn btn-outline-danger btn-sm" id="logoutBtn">Đăng xuất</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="popcorn__list">
        <h3 class="popcorn__names">GÓC BẮP RANG</h3><br>
        <div class="popcorn__items">
            <div id="popcornList" class="w-100"></div>
        </div>
    </div>

    <div class="food__list">
        <h3 class="food__names">GÓC ĂN VẶT</h3><br>
        <div class="food__items">
            <div id="snackList" class="w-100"></div>
        </div>
    </div>

    <div class="drink__list">
        <h3 class="drink__names">GÓC GIẢI KHÁT</h3><br>
        <div class="drink__items">
            <div id="drinkList" class="w-100"></div>
        </div>

        <footer>
            <h3>Thông tin liên hệ</h3><br>
            <ul class="contact">
                <li><a href="https://www.facebook.com/" class="acontact"><ion-icon name="logo-facebook"></ion-icon>
                        Facebook</a></li>
                <li><a href="https://www.instagram.com/" class="acontact"><ion-icon name="logo-instagram"></ion-icon>
                        Instragram</a></li>
                <li><a href="https://www.tiktok.com/" class="acontact"><ion-icon name="logo-tiktok"></ion-icon>
                        Tiktok</a></li>
            </ul>
            <div class="footer1">
                <img src="blob:https://chat.zalo.me/e3f32788-77da-400d-8c15-a14f0e3cea09" alt="xem vv">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.032035987264!2d106.61574717401756!3d10.808858258596757!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752b224555b4d1%3A0xaa7cf57b43e83db1!2sMindX%20Technology%20School%20(T%C3%A2y%20Th%E1%BA%A1nh)!5e0!3m2!1svi!2s!4v1758889951108!5m2!1svi!2s"
                    width="600" height="288" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </footer>

        <!-- Modal giỏ hàng -->
        <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="cartModalLabel">Giỏ hàng</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="cartItems" class="d-flex flex-column gap-2"></div>
                        <div class="text-end mt-3">
                            <div><strong>Tổng:</strong> <span id="cartTotal">0₫</span></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-danger" id="clearCartBtn">Xoá tất cả</button>
                        <button type="button" class="btn btn-success" id="checkoutBtn">Thanh toán</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal thanh toán -->
        <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="checkoutModalLabel">Thanh toán</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <h6 class="fw-bold">Sản phẩm bạn định mua</h6>
                        <div id="checkoutSummary" class="d-flex flex-column gap-2 mb-3"></div>
                        <div class="text-end mb-3">
                            <strong>Tổng thanh toán:</strong> <span id="checkoutTotal">0₫</span>
                        </div>
                        <hr>
                        <h6 class="fw-bold">Thông tin giao hàng</h6>
                        <form id="checkoutForm">
                            <div class="mb-3">
                                <label for="shipName" class="form-label">Tên người nhận</label>
                                <input type="text" class="form-control" id="shipName" placeholder="Họ và tên" required>
                            </div>
                            <div class="mb-3">
                                <label for="shipPhone" class="form-label">Số điện thoại</label>
                                <input type="tel" class="form-control" id="shipPhone" placeholder="09xxxxxxxx" required>
                            </div>
                            <div class="mb-3">
                                <label for="shipAddress" class="form-label">Địa chỉ giao hàng</label>
                                <textarea class="form-control" id="shipAddress" rows="3"
                                    placeholder="Số nhà, đường, phường, quận, thành phố..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="confirmCheckoutBtn">Thanh toán</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <script src="./main.js"></script>
        <script type="module" src="shopping-fetch.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>
